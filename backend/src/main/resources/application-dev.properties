# Dev Profile Configuration
# Seed data and the mock payment gateway. External services come from environment variables:
# locally from backend/.env (see .env.example), in Kubernetes from the smartcampus-secrets Secret.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
app.payment.mock.magic-amounts=true
app.push.provider=log
app.mail.provider=log
management.health.rabbit.enabled=true
