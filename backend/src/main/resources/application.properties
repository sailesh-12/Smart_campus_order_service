spring.application.name=backend
spring.profiles.active=dev
spring.main.allow-circular-references=true

# Server & Graceful Shutdown
server.shutdown=graceful
server.port=8080

# Datasource & JPA
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# JWT Security
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
app.jwt.expiration-minutes=60

# Order & Menu Configuration
app.order.hold-minutes=5
app.order.max-qty-per-item=10
app.menu.low-stock-threshold=5

# Payment & Webhook Configuration
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
app.payment.reconcile-interval-seconds=30
app.payment.unconfirmed-max-minutes=30
app.payment.refund-max-attempts=3
app.payment.mock.magic-amounts=false

# ETA Configuration
app.eta.rush-extra-minutes=10
app.eta.range-factor=1.3
app.eta.busy-threshold-minutes=5
app.eta.packed-threshold-minutes=15

# Events Transport: spring or rabbit
app.events.transport=spring

# Rate Limits & Hoarding Prevention
app.order.max-unpaid-per-student=2
app.order.rate-limit-per-minute=5
app.auth.rate-limit-per-minute=10

# Uncollected Orders Configuration
app.order.uncollected-reminder-minutes=15
app.order.uncollected-flag-minutes=45

# Push Notification Configuration
app.push.provider=log
app.push.fcm-credentials-path=${FCM_CREDENTIALS_PATH:}
app.push.max-tokens-per-user=5

# Auth & Reset Password Configuration
app.auth.reset-token-minutes=30
app.auth.reset-link-base=${RESET_LINK_BASE:http://localhost:3000/reset-password}
app.mail.provider=log
app.mail.from=${MAIL_FROM:no-reply@campus.local}
