apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartcampus-prod
  namespace: argocd
spec:
  project: smartcampus
  source:
    repoURL: https://github.com/sailesh-12/Smart_campus_order_service.git
    targetRevision: main
    path: infra/helm/backend
    helm:
      releaseName: smartcampus
      valueFiles:
        - ../values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: smartcampus-prod
  # Manual sync only: a promotion commit makes prod OutOfSync, and a person syncs it (argocd app sync smartcampus-prod)
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
