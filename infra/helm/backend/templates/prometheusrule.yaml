{{- if and .Values.metrics.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- $ns := .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  groups:
    - name: smartcampus-backend
      rules:
        - alert: SmartCampusBackendDown
          expr: absent(up{namespace="{{ $ns }}", service="{{ include "backend.fullname" . }}"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No backend pod in {{ $ns }} is being scraped successfully
        - alert: SmartCampusHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="{{ $ns }}", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="{{ $ns }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of backend requests in {{ $ns }} return 5xx
        - alert: SmartCampusSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="{{ $ns }}", uri!~".*/events|.*/stream"}[5m]))) > 1.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: p95 backend latency in {{ $ns }} is above 1.5 s (SSE streams excluded)
        - alert: SmartCampusHeapHigh
          expr: |
            max by (pod) (sum by (pod) (jvm_memory_used_bytes{namespace="{{ $ns }}", area="heap"})
              / sum by (pod) (jvm_memory_max_bytes{namespace="{{ $ns }}", area="heap"} > 0)) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A backend pod in {{ $ns }} has used more than 90% of its heap for 10 minutes
{{- end }}
