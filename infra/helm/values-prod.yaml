# Production (namespace smartcampus-prod). Argo CD syncs MANUALLY. Promoted by promote.yml (required reviewers).
image:
  # Managed by .github/workflows/promote.yml: only this line is edited.
  tag: "0000000000000000000000000000000000000000"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi

config:
  # prod profile: no mock payment gateway, no seed data, FCM push and SMTP mail providers
  SPRING_PROFILES_ACTIVE: prod
  # Several replicas: order events must reach every pod's SSE connections through RabbitMQ.
  # NOTE: the relay for this mode is not implemented in the backend yet (see docs/ci-cd.md, "Known gaps").
  APP_EVENTS_TRANSPORT: rabbit
  APP_TIME_ZONE: Asia/Kolkata
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 30s
  # SMTP host/user/password come from the Secret (MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD); the prod
  # profile refuses to start without a mail host. Port and TLS are not secret:
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  MAIL_FROM: no-reply@smartcampus.example.com
  RESET_LINK_BASE: https://app.smartcampus.example.com/reset-password

ingress:
  host: api.smartcampus.example.com
  tls:
    - hosts: [api.smartcampus.example.com]
      secretName: smartcampus-prod-tls
