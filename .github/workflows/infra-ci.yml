# GitOps repo checks: the chart must lint and render for every environment.
name: Infra CI

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1
      - name: helm lint
        run: helm lint infra/helm/backend -f infra/helm/values-${{ matrix.env }}.yaml --strict
      - name: helm template
        run: |
          helm template backend infra/helm/backend -f infra/helm/values-${{ matrix.env }}.yaml \
            --namespace smartcampus-${{ matrix.env }} > rendered.yaml
          echo "Rendered $(grep -c '^kind:' rendered.yaml) objects:"
          grep '^kind:' rendered.yaml | sort | uniq -c

  argocd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Argo CD manifests are valid YAML and point at existing values files
        run: |
          for f in infra/argocd/*.yaml; do yq eval 'true' "$f" > /dev/null; done
          for env in dev staging prod; do
            grep -q "values-${env}.yaml" "infra/argocd/application-${env}.yaml"
            test -f "infra/helm/values-${env}.yaml"
          done
