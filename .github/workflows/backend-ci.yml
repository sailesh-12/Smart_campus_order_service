# Backend: test -> analyse -> build, scan, push image (main) -> deploy to dev via GitOps (main).
name: Backend CI/CD

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    # infra/** is not listed, so the deploy-dev commit below never retriggers this workflow
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests (Surefire, *Test) + JaCoCo
        run: ./mvnw -B test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.6-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Postgres and RabbitMQ come from Testcontainers; unit tests are skipped here (they ran in the job above)
      - name: Integration tests (Failsafe, integration/*IT) + JaCoCo
        run: ./mvnw -B verify -Dtest=SkipUnitTests -Dsurefire.failIfNoSpecifiedTests=false
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-reports
          path: |
            backend/target/failsafe-reports/
            backend/target/site/jacoco-it/
          if-no-files-found: warn

  sonarqube:
    needs: [unit-tests, integration-tests]
    # Secrets are not available to pull requests from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for blame and new-code detection
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-test-reports"
          merge-multiple: true
          path: backend/target
      - name: Scan and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SONAR_TOKEN and SONAR_HOST_URL repository secrets are required (see docs/ci-cd.md)"
            exit 1
          fi
          ./mvnw -B -DskipTests test-compile sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

  image:
    needs: [unit-tests, integration-tests, sonarqube]
    # Runs when tests passed and Sonar passed (or was skipped for a fork PR)
    if: >-
      !cancelled() && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
      && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: name
        name: Image name (registry paths must be lowercase)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixed HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push (tag = commit SHA, never latest)
        run: docker push "${{ steps.name.outputs.image }}:${GITHUB_SHA}"

  deploy-dev:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: write
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # GITOPS_TOKEN (GitHub App or fine-grained PAT) is needed when main is protected; see docs/ci-cd.md
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
      - name: Set image.tag in values-dev.yaml
        run: infra/scripts/set-image-tag.sh infra/helm/values-dev.yaml "$GITHUB_SHA"
      - name: Commit and push
        run: |
          git config user.name "smartcampus-gitops[bot]"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add infra/helm/values-dev.yaml
          git diff --cached --quiet && { echo "Tag already deployed"; exit 0; }
          git commit -m "chore(dev): deploy backend ${GITHUB_SHA::12}"
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Smoke test (needs DEV_BASE_URL)
        env:
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$DEV_BASE_URL" ]; then
            echo "::notice::DEV_BASE_URL is not set; skipping the smoke test (a local cluster is not reachable from GitHub runners)"
            exit 0
          fi
          # Give Argo CD time to sync and the rollout to finish
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "$DEV_BASE_URL/actuator/health/readiness" | grep -q '"UP"'; then
              echo "Dev is ready"; exit 0
            fi
            sleep 15
          done
          echo "::error::$DEV_BASE_URL/actuator/health/readiness did not report UP within 10 minutes"
          exit 1
